name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Simple WebView APK
        run: |
          mkdir -p res/layout res/values bin build/outputs/apk
          
          # 1. Layout file
          cat << 'EOF' > res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # 2. Styles/Strings file
          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SRCSC</string>
          </resources>
          EOF

          # 3. AAPT Resource Compilation
          $ANDROID_HOME/build-tools/33.0.0/aapt package -f -m -J . -M AndroidManifest.xml -S res -I $ANDROID_HOME/platforms/android-33/android.jar

          # 4. Compile Java Files
          javac -d bin -classpath $ANDROID_HOME/platforms/android-33/android.jar *.java

          # 5. Convert to DEX
          $ANDROID_HOME/build-tools/33.0.0/dx --dex --output=classes.dex bin/

          # 6. Package Unsigned APK
          $ANDROID_HOME/build-tools/33.0.0/aapt package -f -M AndroidManifest.xml -S res -I $ANDROID_HOME/platforms/android-33/android.jar -F build/outputs/apk/app-unsigned.apk .

          # 7. Add DEX into APK
          cd build/outputs/apk
          $ANDROID_HOME/build-tools/33.0.0/aapt add app-unsigned.apk ../../../classes.dex

          # 8. Sign APK
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          $ANDROID_HOME/build-tools/33.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android app-unsigned.apk
          mv app-unsigned.apk app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/outputs/apk/app-release.apk
