name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Fix Structure & Build APK
        run: |
          # Create clean app directory structure
          mkdir -p project/app/src/main/java/com/example/webviewapp
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values

          # Move Manifest
          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          else
            cat << 'EOF' > project/app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.webviewapp">
                <uses-permission android:name="android.permission.INTERNET" />
                <application android:allowBackup="true" android:label="SRCSC" android:supportsRtl="true">
                    <activity android:name=".MainActivity" android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF
          fi

          # Move MainActivity
          if [ -f MainActivity.java ]; then
            cp MainActivity.java project/app/src/main/java/com/example/webviewapp/MainActivity.java
          fi

          # Create Layout
          cat << 'EOF' > project/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # Create Root build.gradle
          cat << 'EOF' > project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Create App build.gradle
          cat << 'EOF' > project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.webviewapp'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.webviewapp"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Create settings.gradle
          cat << 'EOF' > project/settings.gradle
          include ':app'
          EOF

          # Run Gradle Build
          cd project
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/app/build/outputs/apk/debug/app-debug.apk
